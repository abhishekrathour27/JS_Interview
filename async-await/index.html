<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Styled Button</title>
</head>
<body>

  <button
  id="btn"
   style="
    padding: 12px 28px;
    font-size: 16px;
    font-weight: 600;
    color: white;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.3s;
  ">
    Click Me
  </button>

</body>
<script src="script.js"></script>
</html>
